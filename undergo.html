<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undergo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }

        .splash-logo {
            font-size: 64px;
            font-weight: bold;
            color: #fff;
            letter-spacing: -2px;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 15px rgba(255,255,255,0.4); }
        }

        #main-content {
            display: none;
            max-width: 600px;
            margin: 0 auto;
            border-left: 1px solid #2f3336;
            border-right: 1px solid #2f3336;
            min-height: 100vh;
            box-sizing: border-box;
            background-color: #000;
        }

        .header {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #2f3336;
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .header-logo {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            letter-spacing: -1px;
        }

        .post-box {
            padding: 15px 20px;
            border-bottom: 1px solid #2f3336;
            display: flex;
            gap: 15px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #555;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }

        .post-content .username {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .post-content .userid {
            color: #71767b;
            font-weight: normal;
            font-size: 14px;
        }

        .post-content .text {
            color: #e7e9ea;
            font-size: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-logo">U</div>
    </div>

    <div id="main-content">
        <div class="header">
            <div class="header-logo">U</div>
        </div>

        <div class="post-box">
            <div class="avatar" style="background-image: url('https://raw.githubusercontent.com/214-1031dotcom/ARG-/main/IMG_7440.jpeg');"></div>
            <div class="post-content">
                <div class="username">にーよ8号 <span class="userid">@YingDou21485</span></div>
                <div class="text">Undergoシステム、起動テスト完了。……さて、始めるか。</div>
            </div>
        </div>

        <div class="post-box">
            <div class="avatar" style="background-image: url('https://raw.githubusercontent.com/214-1031dotcom/ARG-/main/IMG_7471.jpeg');"></div>
            <div class="post-content">
                <div class="username">もやし <span class="userid">@moyashi_create</span></div>
                <div class="text">おつかれさま！ここからどう動くかだねー 👀✨</div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                const splash = document.getElementById('splash-screen');
                const main = document.getElementById('main-content');

                splash.style.opacity = '0';
                
                setTimeout(function() {
                    splash.style.display = 'none';
                    main.style.display = 'block';
                    document.body.style.overflow = 'auto';
                }, 600);

            }, 2000);
        });
    </script>

</body>
</html>
