<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undergo</title>
    <style>
        /* 📱 全体の基本設定（ダークモード風の黒背景） */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* ローディング中はスクロールさせない */
        }

        /* 🚀 起動画面（スプラッシュスクリーン）のスタイル */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000; /* Xアプリみたいな完全な黒 */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease; /* 消えるときのふわっとした演出 */
        }

        /* 真ん中の「U」ロゴのデザイン */
        .splash-logo {
            font-size: 64px;
            font-weight: bold;
            color: #fff;
            letter-spacing: -2px;
            animation: pulse 1.2s infinite alternate; /* 軽く呼吸するように光るアニメーション */
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 15px rgba(255,255,255,0.4); }
        }

        /* 🐦 本体のタイムライン画面（最初は隠れている） */
        #main-content {
            display: none; /* ローディングが終わるまで非表示 */
            max-width: 600px;
            margin: 0 auto;
            border-left: 1px solid #2f3336;
            border-right: 1px solid #2f3336;
            height: 100vh;
            box-sizing: border-box;
            overflow-y: auto;
        }

        /* タイムラインの中身の仮デザイン */
        .header {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #2f3336;
            padding: 15px 20px;
            font-size: 20px;
            font-weight: bold;
        }
        .post-box {
            padding: 15px 20px;
            border-bottom: 1px solid #2f3336;
            display: flex;
            gap: 15px;
        }
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #555;
            flex-shrink: 0;
        }
        .post-content .username {
            font-weight: bold;
            margin-bottom: 4px;
        }
        .post-content .text {
            color: #e7e9ea;
            font-size: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- 🚀 起動画面（スプラッシュ） -->
    <div id="splash-screen">
        <div class="splash-logo">U</div>
    </div>

    <!-- 📱 Undergo メイン画面（タイムライン） -->
    <div id="main-content">
        <div class="header">ホーム</div>

        <!-- 投稿のサンプル1 -->
        <div class="post-box">
            <div class="avatar" style="background: #3498db;"></div>
            <div class="post-content">
                <div class="username">にーよ8号 <span style="color: #71767b; font-weight: normal;">@YingDou21485</span></div>
                <div class="text">Undergoシステム、起動テスト完了。……さて、始めるか。</div>
            </div>
        </div>

        <!-- 投稿のサンプル2 -->
        <div class="post-box">
            <div class="avatar" style="background: #e74c3c;"></div>
            <div class="post-content">
                <div class="username">もやし <span style="color: #71767b; font-weight: normal;">@moyashi_create</span></div>
                <div class="text">おつかれさま！ここからどう動くかだねー 👀✨</div>
            </div>
        </div>
    </div>

    <!-- ⏱️ 起動画面を消してメイン画面に切り替えるプログラム -->
    <script>
        window.addEventListener('load', function() {
            // 2.0秒（2000ミリ秒）後に起動画面を消す演出
            setTimeout(function() {
                const splash = document.getElementById('splash-screen');
                const main = document.getElementById('main-content');

                // ふわっと消す
                splash.style.opacity = '0';
                
                setTimeout(function() {
                    splash.style.display = 'none'; // 完全に非表示にする
                    main.style.display = 'block';  // タイムラインを表示
                    document.body.style.overflow = 'auto'; // スクロールを許可
                }, 600); // 消失アニメーションが終わるのを待つ時間

            }, 2000); // ← ここを「1500」にすれば1.5秒、「3000」にすれば3秒になるよ！
        });
    </script>

</body>
</html>
