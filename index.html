<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>日乃市立月々星小学校</title>
    <style>
        body {
            background-color: #f0f4f8; /* 学校っぽい清潔感のある薄い青灰色 */
            color: #333333;
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background-color: #1a5276; /* 深い青色（校旗や制服っぽいイメージ） */
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
        }
        .content {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .news {
            color: #c0392b; /* お知らせの赤色 */
            font-weight: bold;
        }
    </style>
</head>
<body>
<img src="https://github.com/214-1031dotcom/ARG-/blob/main/IMG_7407.jpeg?raw=true" alt="日乃市立月々星小学校 校舎" style="width:100%; display:block; margin:0 auto;">
    <header>
        <h1>日乃市立月々星小学校</h1>
        <p>〜星のように美しく、個々で輝く〜</p>
    </header>

    <div class="content">
        <h2>新着情報 / お知らせ</h2>
        <ul>
            <li><span class="news">【重要】</span>ホームページをリニューアルしました。</li>
            <li>運動会のお知らせを更新しました。</li>
            <li>「月々星小の歴史」のページを追加しました。</li>
        </ul>
        
        <p>ようこそ、日乃市立月々星小学校のホームページへ。本校は豊かな自然に囲まれた、歴史ある小学校です。</p>
    </div>

</body>
</html>
