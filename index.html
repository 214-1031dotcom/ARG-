<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日乃市立月々星小学校</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #005f8a;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }
        header h1 { margin: 0; font-size: 24px; }
        header p { margin: 5px 0 0; font-size: 14px; color: #e0f2fe; }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        /* 学校紹介 */
        .school-info-box {
            background: #f8f9fa;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .school-info-box h3 { margin-top: 0; color: #005f8a; font-size: 15px; }
        
        /* 写真 */
        .school-image { text-align: center; margin: 20px 0; }
        .school-image img { max-width: 100%; height: auto; border-radius: 5px; border: 1px solid #ddd; }
        
        h2 { color: #005f8a; border-bottom: 2px solid #005f8a; padding-bottom: 5px; font-size: 18px; margin-top: 30px; }
        
        .news-list { list-style: none; padding: 0; }
        .news-list li { padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .news-date { color: #777; font-weight: bold; margin-right: 15px; }
        
        .link-buttons { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .link-btn {
            flex: 1; min-width: 200px; background: #f8f9fa; border: 1px solid #ddd;
            padding: 15px; text-align: center; border-radius: 5px; text-decoration: none;
            color: #005f8a; font-weight: bold;
        }
        
        /* 一番下の住所・連絡先エリア */
        .bottom-section {
            margin-top: 50px;
            border-top: 2px solid #ddd;
            padding-top: 20px;
            text-align: center;
        }
        .school-address-box {
            font-size: 13px;
            color: #555;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        footer { text-align: center; padding: 20px; font-size: 12px; color: #777; margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <h1>日乃市立月々星小学校</h1>
    <p>公式サイトへようこそ</p>
</header>

<div class="container">

    </div>

    <div class="school-image">
        <img src="IMG_7418_6b90e7.jpg" alt="日乃市立月々星小学校 校舎">
    </div>

    <h2>新着情報・お知らせ</h2>
    <ul class="news-list">
        <li><span class="news-date">2018.10.15</span>10月の行事予定を更新しました。</li>
        <li><span class="news-date">2017.09.01</span>保健室より<a href="nurse.html" style="color: #005f8a; text-decoration: underline;">「2017年度 9月号」</a>を公開しました。</li>
        <li><span class="news-date">2017.07.10</span>夏期休業前の全校集会についてのお知らせ</li>
    </ul>

    <h2>校内各ページへのご案内</h2>
    <div class="link-buttons">
        <a href="calendar.html" class="link-btn">📅 行事予定</a>
        <a href="nurse.html" class="link-btn">🌿 流れ星号(保健室)</a>
    </div>

    <!-- 一番下：住所と電話番号のみ -->
    <div class="bottom-section">
        <div class="school-address-box">
            <p style="margin: 0;">
            <strong>日乃市立月々星小学校</strong><br>
            所在地：〒190-0000 日乃市月々星町 1-9-0 ｜ 電話番号：09-28XX-XXXX
            </p>
        </div>
    </div>

</div>

<footer>
    <p>※当サイトはフィクションです。実在の人物・団体・学校とは一切関係ありません。2026 </p>
</footer>

</body>
</html>
