<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mariage 検索</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .logo { font-size: 60px; font-weight: bold; margin-bottom: 20px; }
        .search-input { width: 300px; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
    </style>
</head>
<body>
    <div class="logo">Mariage</div>
    <input type="text" id="searchInput" class="search-input" placeholder="検索ワードを入力">
    <br>
    <button onclick="checkSearch()">検索</button>

    <script>
        function checkSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.location.href = 'search.html?q=' + encodeURIComponent(query);
            }
        }
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkSearch();
        });
    </script>
</body>
</html>
