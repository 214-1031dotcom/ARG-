<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #fff;
            color: #222;
        }
        .logo {
            font-size: 64px;
            font-weight: bold;
            letter-spacing: -2px;
            margin-bottom: 25px;
            user-select: none;
        }
        .logo span:nth-child(1) { color: #4285F4; }
        .logo span:nth-child(2) { color: #EA4335; }
        .logo span:nth-child(3) { color: #FBBC05; }
        .logo span:nth-child(4) { color: #4285F4; }
        .logo span:nth-child(5) { color: #34A853; }
        .logo span:nth-child(6) { color: #EA4335; }
        .logo span:nth-child(7) { color: #FBBC05; }
        .logo span:nth-child(8) { color: #4285F4; }

        /* ホーム画面の検索バーとアイコンのスタイル */
        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 90%;
            max-width: 584px;
            margin-bottom: 25px;
        }
        .search-input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            box-sizing: border-box;
            box-shadow: none;
            transition: box-shadow 0.2s;
        }
        .search-input:hover, .search-input:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
            border-color: rgba(223,225,229,0);
        }
        .search-icon {
            position: absolute;
            left: 16px;
            width: 20px;
            height: 20px;
            color: #9aa0a6;
            pointer-events: none;
        }

        .search-btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        .search-btn:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0,0,0,.1);
            color: #202124;
        }
        .footer-version {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: #70757a;
        }
    </style>
</head>
<body>

    <div class="logo">
        <span>M</span><span>a</span><span>r</span><span>i</span><span>a</span><span>g</span><span>e</span>
    </div>

    <div class="search-wrapper">
        <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="キーワードを入力して検索 (例: にーよ8号)">
    </div>

    <button class="search-btn" id="searchBtn">Mariage 検索</button>

    <div class="footer-version">Mariage Search Engine (v2.1.0)</div>

    <script>
        const input = document.getElementById('searchInput');
        const btn = document.getElementById('searchBtn');

        function doSearch() {
            const query = input.value.trim();
            if (query) {
                window.location.href = 'search2.html?q=' + encodeURIComponent(query);
            }
        }

        btn.addEventListener('click', doSearch);
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                doSearch();
            }
        });
    </script>
</body>
</html>
