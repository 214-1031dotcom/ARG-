<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日乃市立月々星小学校</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #005f8a;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
        }
        header p {
            margin: 5px 0 0;
            font-size: 14px;
            color: #e0f2fe;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            color: #005f8a;
            border-bottom: 2px solid #005f8a;
            padding-bottom: 5px;
            font-size: 18px;
            margin-top: 30px;
        }
        /* 新着情報・お知らせのリスト */
        .news-list {
            list-style: none;
            padding: 0;
        }
        .news-list li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .news-date {
            color: #777;
            font-weight: bold;
            margin-right: 15px;
        }
        /* ページ内リンクのボタンスタイル */
        .link-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .link-btn {
            flex: 1;
            min-width: 200px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            text-decoration: none;
            color: #005f8a;
            font-weight: bold;
            transition: background 0.2s;
        }
        .link-btn:hover {
            background: #e2e8f0;
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

<header>
    <h1>日乃市立月々星小学校</h1>
    <p>公式サイトへようこそ</p>
</header>

<div class="container">
    <h2>新着情報・お知らせ</h2>
    <ul class="news-list">
        <li><span class="news-date">2017.10.15</span>10月・11月の行事予定を更新しました。</li>
        <li><span class="news-date">2017.09.01</span>保健室より「2017年度 9月号」を公開しました。</li>
        <li><span class="news-date">2017.07.10</span>夏期休業前の全校集会についてのお知らせ</li>
    </ul>

    <h2>校内各ページへのご案内</h2>
    <div class="link-buttons">
        <a href="calendar.html" class="link-btn">📅 学校行事予定を見る</a>
        <a href="nurse.html" class="link-btn">🌿 保健室より（おたより）</a>
    </div>
</div>

<footer>
    <p>&copy; 2017 Hinoshiritsu Tsukigaboshi Elementary School. All Rights Reserved.</p>
</footer>

</body>
</html>
