<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学校の沿革 - 日乃市立月々星小学校</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: #fff;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        .page-title {
            font-size: 24px;
            font-weight: bold;
            color: #1a5276;
            margin-bottom: 20px;
            border-bottom: 2px solid #1a5276;
            padding-bottom: 10px;
        }
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .history-item {
            display: flex;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .history-year {
            width: 130px;
            font-weight: bold;
            color: #1a5276;
            flex-shrink: 0;
        }
        .history-desc {
            flex-grow: 1;
            color: #444;
            font-size: 15px;
        }
        .back-link {
            margin-top: 30px;
            display: inline-block;
            color: #1a0dab;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-title">学校の沿革</div>

        <ul class="history-list">
            <li class="history-item">
                <div class="history-year">昭和22年（1947年）</div>
                <div class="history-desc">戦後の学制改革に伴い、日乃市立月々星小学校として創立。初代校舎が落成する。</div>
            </li>
            <li class="history-item">
                <div class="history-year">昭和48年（1973年）</div>
                <div class="history-desc">老朽化に伴い、現在の鉄筋コンクリート造りの新校舎が完成。</div>
            </li>
            <li class="history-item">
                <div class="history-year">平成29年（2017年）</div>
                <div class="history-desc">創立70周年を迎える。記念事業として、校内施設の大規模な改修・安全対策工事を実施。</div>
            </li>
            <li class="history-item">
                <div class="history-year">現在</div>
                <div class="history-desc">「星のように輝き、美しく」の校訓のもと、地域に開かれた学校として歩みを続けている。</div>
            </li>
        </ul>

        <a href="school.html" class="back-link">＜ 学校トップに戻る</a>
    </div>

</body>
</html>
