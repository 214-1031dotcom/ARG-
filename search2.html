<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索結果 - Mariage</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; color: #222; background-color: #fff; }
        .header-area { display: flex; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #ebebeb; padding-bottom: 15px; }
        .mini-logo { font-size: 28px; font-weight: bold; letter-spacing: -1px; margin-right: 20px; text-decoration: none; }
        .mini-logo span:nth-child(1) { color: #4285F4; } 
        .mini-logo span:nth-child(2) { color: #EA4335; } 
        .mini-logo span:nth-child(3) { color: #FBBC05; } 
        .mini-logo span:nth-child(4) { color: #4285F4; } 
        .mini-logo span:nth-child(5) { color: #34A853; } 
        .mini-logo span:nth-child(6) { color: #EA4335; } 
        .mini-logo span:nth-child(7) { color: #FBBC05; } 
        .mini-logo span:nth-child(8) { color: #4285F4; }
        
        .mini-search-wrapper { position: relative; display: flex; align-items: center; width: 100%; max-width: 500px; }
        .mini-search-input { width: 100%; padding: 8px 15px 8px 40px; font-size: 15px; border: 1px solid #dfe1e5; border-radius: 24px; outline: none; box-sizing: border-box; }
        .search-icon { position: absolute; left: 14px; width: 18px; height: 18px; color: #9aa0a6; pointer-events: none; }
        
        .sub-header { max-width: 650px; margin-left: 120px; margin-bottom: 20px; font-size: 13px; display: flex; gap: 15px; border-bottom: 1px solid #ebebeb; padding-bottom: 8px; }
        .sub-header a { text-decoration: none; color: #70757a; padding-bottom: 8px; }
        .sub-header .active { color: #1a0dab; font-weight: bold; border-bottom: 2px solid #1a0dab; }

        .main-layout { display: flex; align-items: flex-start; position: relative; }
        .side-icon-area { width: 100px; display: flex; justify-content: center; padding-top: 5px; flex-shrink: 0; }
        .side-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }

        .results-content { flex-grow: 1; max-width: 650px; }
        .search-result-item { margin-bottom: 25px; }
        .result-url { font-size: 12px; color: #202124; margin-bottom: 2px; }
        .result-title { color: #1a0dab; font-size: 20px; text-decoration: none; display: inline-block; margin-bottom: 3px; }
        .result-title:hover { text-decoration: underline; }
        .result-desc { color: #4d5156; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="header-area">
        <a href="index.html" class="mini-logo">
            <span>M</span><span>a</span><span>r</span><span>i</span><span>a</span><span>g</span><span>e</span>
        </a>
        <div class="mini-search-wrapper">
            <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            <input type="text" id="miniSearchInput" class="mini-search-input">
        </div>
    </div>

    <div class="sub-header">
        <a href="#" class="active" id="tabAll">すべて</a>
        <a href="#" id="tabImages">画像</a>
        <a href="#" id="tabNews">ニュース</a>
        <span id="hitCount" style="margin-left: auto; color: #70757a;"></span>
    </div>

    <div class="main-layout">
        <div class="side-icon-area">
            <img id="sideIconImg" src="https://raw.githubusercontent.com/214-1031dotcom/ARG-/main/IMG_7440.jpeg" alt="アイコン" class="side-avatar">
        </div>
        <div class="results-content" id="searchResults"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let query = params.get('q') || '';
        document.getElementById('miniSearchInput').value = query;

        const sideIconImg = document.getElementById('sideIconImg');
        const container = document.getElementById('searchResults');

        document.getElementById('tabAll').href = 'search2.html?q=' + encodeURIComponent(query);
        document.getElementById('tabImages').href = 'images.html?q=' + encodeURIComponent(query);
        document.getElementById('tabNews').href = 'news.html?q=' + encodeURIComponent(query);

        // 全検索データ
        let results = [
            { title: "にーよ8号", url: "https://x.com/YingDou21485", desc: "Plan_aot主導者" },
            { title: "月々星小学校", url: "school.html", desc: "日乃市立月々星小学校" },
            { title: "月の落石事件", url: "news_20171031.html", desc: "2017年10月31日に発生した事件の全貌とニュース報道。" },
            { 
                title: "Plan_aot / 小説シリーズ - pixiv", 
                url: "https://www.pixiv.net/novel/series/14359145", 
                desc: "pixivに投稿された、Plan_aot小説シリーズ。この作品の詳しい話を知れるかも……。" 
            },
            { 
                title: "ヒューマリア (@dymnghu125964)", 
                url: "https://x.com/dymnghu125964", 
                desc: "私たちヒューマリアが運営する公式X(旧Twitter)アカウント！" 
            },
            { 
                title: "Plan_aot 公式YouTubeチャンネル", 
                url: "https://youtube.com/@aot.01234?si=mMRoj_ybAeQ50V4T", 
                desc: "Plan_aotの公式YouTubeチャンネルです。" 
            },
            { title: "ひなあられ", url: "https://x.com/hina_arare1211", desc: "制作協力者（いつも手伝ってくれてありがとう！）" },
            { title: "佐藤めいこ", url: "https://x.com/Satou_meiko", desc: "制作協力者（いつも手伝ってくれてありがとう！）" },
            { title: "宮森", url: "https://x.com/my_my_77777", desc: "制作協力者（いつも手伝ってくれてありがとう！）" },
            { title: "やと", url: "https://x.com/yato_k5", desc: "制作協力者（いつも手伝ってくれてありがとう！）" }
        ];

        // キーワードに応じたアイコンの切り替え（「aot.01234」や「youtube」も追加！）
        if (query.includes('ひなあられ')) {
            sideIconImg.src = 'https://raw.githubusercontent.com/214-1031dotcom/ARG-/main/IMG_7445.jpeg';
            sideIconImg.alt = 'ひなあられ';
        } else if (query.includes('佐藤めいこ')) {
            sideIconImg.src = 'https://raw.githubusercontent.com/214-1031dotcom/ARG-/main/IMG_7446.jpeg';
            sideIconImg.alt = '佐藤めいこ';
        } else if (query.includes('宮森')) {
            sideIconImg.src = 'https://raw.githubusercontent.com/214-1031dotcom/ARG-/main/936932E4-FAD1-4E75-9DCD-4E1712950FEF.jpeg';
            sideIconImg.alt = '宮森';
        } else if (query.includes('やと')) {
            sideIconImg.src = 'https://raw.githubusercontent.com/214-1031dotcom/ARG-/main/0C3924E6-B098-4386-828A-4D10633F06EC.jpeg';
            sideIconImg.alt = 'やと';
        } else if (query.includes('ヒューマリア') || query.includes('dymnghu125964') || query.includes('Plan_aot') || query.includes('aot.01234') || query.includes('youtube')) {
            sideIconImg.src = 'https://raw.githubusercontent.com/214-1031dotcom/ARG-/main/IMG_4999.jpeg';
            sideIconImg.alt = 'ヒューマリア・Plan_aot';
        }

        const cleanQuery = query.trim().toLowerCase();
        
        const filtered = results.filter(item => {
            if (cleanQuery === '') return true;
            return item.title.toLowerCase().includes(cleanQuery) || 
                   item.desc.toLowerCase().includes(cleanQuery) || 
                   item.url.toLowerCase().includes(cleanQuery);
        });

        document.getElementById('hitCount').innerText = `約 ${filtered.length} 件のヒット`;

        if (filtered.length === 0) {
            container.innerHTML = `<div style="color: #70757a; padding: 20px 0;">一致する結果はありませんでした。</div>`;
        } else {
            filtered.forEach(item => {
                container.innerHTML += `
                    <div class="search-result-item">
                        <div class="result-url">${item.url}</div>
                        <a href="${item.url}" class="result-title" target="_blank">${item.title}</a>
                        <div class="result-desc">${item.desc}</div>
                    </div>
                `;
            });
        }

        document.getElementById('miniSearchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                window.location.href = 'search2.html?q=' + encodeURIComponent(this.value.trim());
            }
        });
    </script>
</body>
</html>
