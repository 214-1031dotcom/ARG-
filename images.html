<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像検索 - Mariage</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; color: #222; background-color: #fff; }
        .header-area { display: flex; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #ebebeb; padding-bottom: 15px; }
        .mini-logo { font-size: 28px; font-weight: bold; letter-spacing: -1px; margin-right: 20px; text-decoration: none; }
        .mini-logo span:nth-child(1) { color: #4285F4; } .mini-logo span:nth-child(2) { color: #EA4335; } .mini-logo span:nth-child(3) { color: #FBBC05; } .mini-logo span:nth-child(4) { color: #4285F4; } .mini-logo span:nth-child(5) { color: #34A853; } .mini-logo span:nth-child(6) { color: #EA4335; } .mini-logo span:nth-child(7) { color: #FBBC05; } .mini-logo span:nth-child(8) { color: #4285F4; }
        .mini-search-input { width: 100%; max-width: 500px; padding: 8px 15px; font-size: 15px; border: 1px solid #dfe1e5; border-radius: 24px; outline: none; }
        
        .sub-header { max-width: 650px; margin-left: 120px; margin-bottom: 20px; font-size: 13px; display: flex; gap: 15px; border-bottom: 1px solid #ebebeb; padding-bottom: 8px; }
        .sub-header a { text-decoration: none; color: #70757a; padding-bottom: 8px; }
        .sub-header .active { color: #1a0dab; font-weight: bold; border-bottom: 2px solid #1a0dab; }

        /* 画像検索グリッド */
        .image-container { max-width: 900px; margin-left: 120px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .image-card { border: 1px solid #dfe1e5; border-radius: 8px; overflow: hidden; background: #f8f9fa; text-decoration: none; color: inherit; display: block; }
        .image-card img { width: 100%; height: 140px; object-fit: cover; background-color: #ddd; }
        .image-info { padding: 10px; font-size: 13px; }
        .image-title { font-weight: bold; color: #1a0dab; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .image-source { color: #70757a; font-size: 11px; }

        @media (max-width: 768px) {
            .header-area { flex-direction: column; align-items: flex-start; }
            .image-container, .sub-header { margin-left: 0; }
            .mini-search-input { max-width: 100%; margin-top: 10px; }
        }
    </style>
</head>
<body>

    <div class="header-area">
        <a href="index.html" class="mini-logo"><span>M</span><span>a</span><span>r</span><span>i</span><span>a</span><span>g</span><span>e</span></a>
        <input type="text" id="miniSearchInput" class="mini-search-input">
    </div>

    <div class="sub-header">
        <a href="#" id="tabAll">すべて</a>
        <a href="#" class="active" id="tabImages">画像</a>
        <a href="#" id="tabNews">ニュース</a>
        <span id="hitCount" style="margin-left: auto; color: #70757a;"></span>
    </div>

    <div class="image-container" id="imageResults"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let query = params.get('q') || '';
        document.getElementById('miniSearchInput').value = query;

        document.getElementById('tabAll').href = 'search2.html?q=' + encodeURIComponent(query);
        document.getElementById('tabImages').href = 'images.html?q=' + encodeURIComponent(query);
        document.getElementById('tabNews').href = 'news.html?q=' + encodeURIComponent(query);

        document.getElementById('miniSearchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { window.location.href = 'images.html?q=' + encodeURIComponent(this.value.trim()); }
        });

        // 画像データのデータベース（ここにaotの画像や設定画を仕込めるよ！）
        const imageData = [
            { title: "にーよ8号アイコン", src: "https://via.placeholder.com/300x200?text=YingDou21485", url: "https://x.com/YingDou21485", desc: "Plan_aot主導者" },
            { title: "月々星小学校 校舎", src: "https://via.placeholder.com/300x200?text=School", url: "school.html", desc: "校舎の写真" },
            { title: "月の落石事件現場", src: "https://via.placeholder.com/300x200?text=Meteor", url: "news_20171031.html", desc: "事件当日の現場写真" }
        ];

        const filtered = imageData.filter(item => item.title.includes(query) || item.desc.includes(query));
        document.getElementById('hitCount').innerText = `約 ${filtered.length} 件`;
        const container = document.getElementById('imageResults');

        filtered.forEach(item => {
            container.innerHTML += `
                <a href="${item.url}" class="image-card">
                    <img src="${item.src}" alt="${item.title}">
                    <div class="image-info">
                        <div class="image-title">${item.title}</div>
                        <div class="image-source">${item.url}</div>
                    </div>
                </a>
            `;
        });
    </script>
</body>
</html>
